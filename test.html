<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>校舎内 WebAR 学科紹介</title>

    <!-- A-Frame と MindAR の読み込み -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        /* 画面全体の白抜け防止 */
        html, body { 
            margin: 0; 
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden; 
            font-family: sans-serif; 
            background-color: #000000 !important; 
        }

        #ar-container, a-scene {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            z-index: 1 !important;
            overflow: hidden !important;
        }

        .a-canvas {
            width: 100% !important;
            height: 100% !important;
            top: 0 !important;
            left: 0 !important;
            position: absolute !important;
        }

        body > video, 
        a-scene video {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            min-width: 100% !important;
            min-height: 100% !important;
            width: auto !important;
            height: auto !important;
            object-fit: cover !important;
        }
        
        /* 戻るボタン */
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10000;
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #ffffff;
        }

        /* 階層切り替えUI */
        .floor-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 20px;
            border: 2px solid #ffffff;
        }

        .floor-btn {
            background: transparent;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .floor-btn.active {
            background: #10b981;
            color: white;
        }

        .mindar-ui-overlay, .mindar-ui-scanning {
            display: none !important;
        }

        /* ログメッセージオーバーレイ（枠線部分は非表示） */
        .scan-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .scan-overlay.active { opacity: 1; }

        .scan-message {
            position: absolute;
            top: 15%; /* 画面上部にログを表示 */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 185, 129, 0.95);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #ffffff;
        }

        /* スタンプポップアップ */
        .stamp-dialog-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 20000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .stamp-dialog-box {
            background: #ffffff;
            width: 85%; max-width: 340px;
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        a-assets video {
            display: none !important;
        }
    </style>
</head>
<body>

    <a href="videoMaya.html" class="btn-back">← 戻る</a>

    <div class="floor-selector">
        <button id="btn-1f" class="floor-btn" onclick="switchFloor('1f')">1F</button>
        <button id="btn-2f" class="floor-btn" onclick="switchFloor('2f')">2F</button>
        <button id="btn-3f" class="floor-btn" onclick="switchFloor('3f')">3F</button>
        <button id="btn-4f" class="floor-btn" onclick="switchFloor('4f')">4F</button>
        <button id="btn-5f" class="floor-btn" onclick="switchFloor('5f')">5F</button>
    </div>

    <!-- 検出ログ表示用UI（四角い枠線をカット） -->
    <div id="scan-overlay" class="scan-overlay">
        <div id="scan-text" class="scan-message">🔍 ターゲット検出中...</div>
    </div>

    <div id="ar-container"></div>

    <div id="stamp-dialog" class="stamp-dialog-overlay">
        <div class="stamp-dialog-box">
            <h3 style="margin-top: 0; color: #059669; font-size: 20px;">🎉 スタンプ獲得！</h3>
            <p id="stamp-msg" style="font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 20px;">
                オブジェクトを検出して<br>キャラクターが出現しました！
            </p>
            <div style="display: flex; gap: 10px;">
                <button onclick="closeStampDialog()" style="flex: 1; padding: 10px; border: none; background: #94a3b8; color: white; border-radius: 10px; font-weight: bold; cursor: pointer;">閉じる</button>
                <button onclick="goToMap()" style="flex: 1; padding: 10px; border: none; background: #f59e0b; color: white; border-radius: 10px; font-weight: bold; cursor: pointer;">マップへGO!</button>
            </div>
        </div>
    </div>

   <script>
    const floorData = {
        '1f': { model: 'kougyo2.glb', video: '', floorText: '1F', modelScale: '0.35 0.35 0.35', modelPos: '0 0.45 0.1', videoWidth: '0.8', videoHeight: '0.45' },
        '2f': { model: 'syokutyou.glb', video: '', floorText: '2F', modelScale: '3.5 3.5 3.5', modelPos: '0 0.7 0.15', videoWidth: '1.4', videoHeight: '0.8' },
        '3f': { model: 'fukude3.glb', video: 'hukude2.mp4', floorText: '3F', modelScale: '2.0 2.0 2.0', modelPos: '0 0.55 0.15', videoWidth: '1.0', videoHeight: '0.56' },
        '4f': { model: 'kougyo2.glb', video: 'GameVideo.mp4', floorText: '4F', modelScale: '0.35 0.35 0.35', modelPos: '0 0.55 0.1', videoWidth: '1.2', videoHeight: '0.68' },
        '5f': { model: 'syougyou3.glb', video: 'jgvideo2.mp4', floorText: '5F', modelScale: '1.5 1.5 1.5', modelPos: '0 0.5 0.1', videoWidth: '0.9', videoHeight: '0.5' }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let selectedFloor = (urlParams.get('floor') || '1f').toLowerCase();
    if (!floorData[selectedFloor]) selectedFloor = '1f';

    let currentConfig = floorData[selectedFloor];

    window.addEventListener('DOMContentLoaded', () => {
        updateActiveButton(selectedFloor);
        buildARScene();
    });

    function updateActiveButton(floorPrefix) {
        document.querySelectorAll('.floor-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-${floorPrefix}`);
        if (activeBtn) activeBtn.classList.add('active');
    }

    function buildARScene() {
        // 4階なら4f2、5階なら5f2、それ以外（1f〜3f）は選択された階数をそのままセット
        const mindFile = `${selectedFloor}(2)`; // 1f(2), 5f(2) などがセットされる
        const container = document.getElementById('ar-container');
        
        // autoplay を完全削除し、最初から動画を完全に停止状態にする
        container.innerHTML = `
        <a-scene
            id="ar-scene"
            mindar-image="imageTargetSrc: ./${mindFile}.mind; autoStart: true; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001;"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights: true"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity light="type: ambient; color: #ffffff; intensity: 2.5;"></a-entity>
            <a-entity light="type: directional; color: #ffffff; intensity: 1.2;" position="1 2 1"></a-entity>

            <a-entity mindar-image-target="targetIndex: 0" id="target-object">
                <a-video
                id="floor-video-entity"
                src="${currentConfig.video}"
                position="0 0 0"
                rotation="0 0 0"
                width="${currentConfig.videoWidth}"
                height="${currentConfig.videoHeight}"
                material="shader: flat; side: double;"
                muted
                playsinline
                webkit-playsinline>
            </a-video>

            <a-gltf-model
                src="${currentConfig.model}"
                position="${currentConfig.modelPos}"
                scale="${currentConfig.modelScale}"
                rotation="0 0 0">
            </a-gltf-model>
            </a-entity>
        </a-scene>
  `;

        setTimeout(() => {
            setupTargetEvents();
        }, 300);
    }

    function switchFloor(floorPrefix) {
        if (floorPrefix === selectedFloor) return;

        window.location.href = `?floor=${floorPrefix}`;

        selectedFloor = floorPrefix;
        currentConfig = floorData[selectedFloor];
        updateActiveButton(selectedFloor);

        const sceneEl = document.getElementById('ar-scene');
        if (sceneEl && sceneEl.systems && sceneEl.systems['mindar-image-system']) {
            try {
                sceneEl.systems['mindar-image-system'].stop();
            } catch (e) {
                console.log("MindAR stop error:", e);
            }
        }

        const container = document.getElementById('ar-container');
        container.innerHTML = '';

        setTimeout(() => {
            buildARScene();
        }, 100);
    }

   // タイマーを保持する変数を関数外（または全体）で宣言
    let stampTimer = null;

    function setupTargetEvents() {
        const targetObject = document.getElementById('target-object');
        const stampDialog = document.getElementById('stamp-dialog');
        const stampMsg = document.getElementById('stamp-msg');
        const videoEntity = document.getElementById('floor-video-entity');

        if (videoEntity) {
            videoEntity.addEventListener('loaded', () => {
                const videoEl = videoEntity.components.material?.material?.map?.image;
                if (videoEl && typeof videoEl.pause === 'function') {
                    videoEl.pause();
                    videoEl.currentTime = 0;
                }
            });
        }

        if (targetObject) {
            // マーカー検出時
            targetObject.addEventListener('targetFound', () => {
                // すでにタイマーが動いていたら念のためクリア
                if (stampTimer) clearTimeout(stampTimer);

                if (videoEntity && videoEntity.components.material && videoEntity.components.material.material.map) {
                    const videoEl = videoEntity.components.material.material.map.image;
                    if (videoEl && typeof videoEl.play === 'function') {
                        videoEl.play().catch(e => console.log("Video play error:", e));
                    }
                }

                localStorage.setItem(`stamp-${currentConfig.floorText}-done`, '1');

                // タイマーをセットして変数に保存（例：10秒後）
                stampTimer = setTimeout(() => {
                    stampMsg.innerHTML = `${currentConfig.floorText} のオブジェクトを検出して<br>キャラクターが出現しました！<br>マップを開いて確認しますか？`;
                    stampDialog.style.display = 'flex';
                }, 10000);
            });

            // マーカーを見失った時
            targetObject.addEventListener('targetLost', () => {
                // 【追加】見失ったらタイマーを即座にキャンセル（リセット）
                if (stampTimer) {
                    clearTimeout(stampTimer);
                    stampTimer = null;
                }

                if (videoEntity && videoEntity.components.material && videoEntity.components.material.material.map) {
                    const videoEl = videoEntity.components.material.material.map.image;
                    if (videoEl && typeof videoEl.pause === 'function') {
                        videoEl.pause();
                    }
                }
            });
        }
    }

    function closeStampDialog() {
        document.getElementById('stamp-dialog').style.display = 'none';
    }

    function goToMap() {
        window.location.href = 'map.html';
    }
</script>
</body>
</html>
